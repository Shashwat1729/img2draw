<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>img2draw — Inverse Drawing Editor</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#1e1e24;color:#eee}
 header{background:#2a2a33;padding:10px 16px}
 main{display:flex;gap:16px;padding:16px}
 aside{width:260px}
 section{flex:1}
 img{max-width:100%;border:1px solid #444}
 button{background:#4a6fa5;color:#fff;border:0;border-radius:4px;padding:6px 10px;margin:2px;cursor:pointer}
 button:disabled{background:#555}
 input[type=range]{width:160px}
 .views{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .layer{background:#2a2a33;padding:6px;margin:4px 0;border-radius:4px}
 .metrics{font-family:monospace;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<header><b>img2draw</b> — upload an image, reconstruct, edit, replay</header>
<main>
<aside>
 <h3>Import</h3>
 <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/tiff">
 <select id="mode"><option>fast</option><option selected>balanced</option><option>high_fidelity</option></select>
 <button onclick="reconstruct()">Reconstruct</button>
 <h3>View</h3>
 <button onclick="setView('orig')">Original</button>
 <button onclick="setView('recon')">Reconstruction</button>
 <button onclick="setView('diff')">Difference</button>
 <button onclick="setView('overlay')">Overlay</button>
 <h3>Layers</h3>
 <div id="layers"></div>
 <h3>Timeline</h3>
 <button onclick="play()">▶</button><button onclick="pause()">⏸</button>
 <button onclick="restart()">⟲</button>
 <input type="range" id="scrub" min="0" max="100" value="100" oninput="scrub()">
 <h3>History</h3>
 <button onclick="api('/api/undo','POST')">Undo</button>
 <button onclick="api('/api/redo','POST')">Redo</button>
 <h3>Export</h3>
 <button onclick="api('/api/export/png?path=export','POST')">PNG</button>
 <button onclick="api('/api/export/webp?path=export','POST')">WebP</button>
 <button onclick="api('/api/export/svg?path=export','POST')">SVG</button>
 <button onclick="api('/api/export/project?path=export','POST')">Project</button>
 <h3>Brush</h3>
 <input type="color" id="color" value="#ff0000">
 <input type="range" id="width" min="1" max="40" value="8">
 <button onclick="brushDemo()">Add diagonal stroke</button>
</aside>
<section>
 <div class="views">
  <div><h4>Original / View</h4><img id="view"></div>
  <div><h4>Reconstruction / Timeline</h4><img id="recon"></div>
 </div>
 <h4>Metrics</h4>
 <div class="metrics" id="metrics"></div>
</section>
</main>
<script>
let totalOps=0, playing=false, view='orig', origB64=null, reconB64=null, diffB64=null, overlayB64=null;
async function api(url, method){ const r = await fetch(url,{method}); return r.json(); }
async function reconstruct(){
 const f = document.getElementById('file').files[0]; if(!f){alert('choose file');return}
 const mode = document.getElementById('mode').value;
 const fd = new FormData(); fd.append('file', f);
 const r = await fetch('/api/reconstruct?mode='+mode, {method:'POST', body:fd});
 const j = await r.json();
 origB64=j.original; reconB64=j.reconstruction;
 totalOps=j.op_count;
 document.getElementById('scrub').max = totalOps;
 document.getElementById('scrub').value = totalOps;
 document.getElementById('metrics').textContent = JSON.stringify(j.metrics,null,1);
 renderLayers(j.layers); setView();
 const c = await (await fetch('/api/compare')).json();
 diffB64=c.difference; overlayB64=c.overlay;
}
function renderLayers(layers){
 const el=document.getElementById('layers'); el.innerHTML='';
 layers.forEach(l=>{
  const d=document.createElement('div'); d.className='layer';
  d.innerHTML=`<input type=checkbox ${l.visible?'checked':''} onchange="api('/api/layer/${l.id}?visible='+this.checked,'POST').then(refresh)">
   ${l.name} (${l.ops} ops)
   <input type=range min=0 max=1 step=0.05 value=${l.opacity} onchange="api('/api/layer/${l.id}?opacity='+this.value,'POST').then(refresh)">
   <button onclick="api('/api/layer/${l.id}/delete','POST').then(refresh)">del</button>`;
  el.appendChild(d);
 });
}
async function refresh(){
 const c=await (await fetch('/api/compare')).json();
 reconB64=c.reconstruction; diffB64=c.difference; overlayB64=c.overlay;
 document.getElementById('metrics').textContent=JSON.stringify(c.metrics,null,1);
 setView();
}
function setView(){
 const v=document.getElementById('view');
 v.src = view==='orig'? 'data:image/png;base64,'+origB64 :
         view==='diff'? 'data:image/png;base64,'+diffB64 :
         view==='overlay'? 'data:image/png;base64,'+overlayB64 :
         'data:image/png;base64,'+reconB64;
 document.getElementById('recon').src='data:image/png;base64,'+reconB64;
}
async function scrub(){
 const n=document.getElementById('scrub').value;
 const j=await (await fetch('/api/render?max_ops='+n)).json();
 reconB64=j.reconstruction; setView();
}
let timer=null;
function play(){ playing=true; let n=0; timer=setInterval(async()=>{ n+=Math.max(1,totalOps/60|0); if(n>=totalOps){pause();n=totalOps} document.getElementById('scrub').value=n; await scrub(); },120); }
function pause(){ playing=false; clearInterval(timer); }
function restart(){ pause(); document.getElementById('scrub').value=0; scrub(); }
async function brushDemo(){
 const col=document.getElementById('color').value;
 const r=parseInt(col.slice(1,3),16), g=parseInt(col.slice(3,5),16), b=parseInt(col.slice(5,7),16);
 const w=+document.getElementById('width').value;
 const pts=[[10,10],[200,200]];
 await fetch('/api/edit/brush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({points:pts,color:[r,g,b],width:w})});
 await refresh();
}
</script>
</body></html>
